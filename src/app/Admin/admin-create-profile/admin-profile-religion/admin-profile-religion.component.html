<div class="fh-5 fw-bold mt-3">Religious Background</div>

<div class="row mt-4 align-items-start">

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Religion
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedReligion"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Religion</option>
        <option *ngFor="let item of religionList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Sect
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedSect"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Sect</option>
        <option *ngFor="let item of sectList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        How Important is Religion to you?
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedReligionImportance"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Importance</option>
        <option *ngFor="let item of religionImportanceList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

</div>
