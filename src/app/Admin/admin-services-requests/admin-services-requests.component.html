<main class="container-fluid ps-3 d-flex flex-column h-100 no-scroll">
  <!-- Header Block using global utility variables -->
  <header class="dashboard-header mb-4">
    <h1 class="ft-7 m-0">Services Request</h1>
    <p class="mt-1 mb-0" style="font-weight: 400; color: #6c727a">
      Manage your services.
    </p>
  </header>

  <!-- Filter Pills Bar (Functional Filters) -->
  <section
    class="d-inline-flex gap-2 mb-4 flex-wrap"
    aria-label="Database Filters"
  >
    <button
      type="button"
      class="filter-pill px-3 py-1.5 border-0 rounded-2 ft-4 fw-medium transition-all"
      [class.active-filter]="activeFilter === 'All'"
      (click)="applyFilter('All')"
    >
      All
    </button>
    <button
      type="button"
      class="filter-pill px-3 py-1.5 border-0 rounded-2 ft-4 fw-medium transition-all"
      [class.active-filter]="activeFilter === 'Matchmaking'"
      (click)="applyFilter('Matchmaking')"
    >
      Matchmaking
    </button>
    <button
      type="button"
      class="filter-pill px-3 py-1.5 border-0 rounded-2 ft-4 fw-medium transition-all"
      [class.active-filter]="activeFilter === 'Events'"
      (click)="applyFilter('Events')"
    >
      Events
    </button>
    <button
      type="button"
      class="filter-pill px-3 py-1.5 border-0 rounded-2 ft-4 fw-medium transition-all"
      [class.active-filter]="activeFilter === 'Destination Wedding'"
      (click)="applyFilter('Destination Wedding')"
    >
      Destination Wedding
    </button>
    <button
      type="button"
      class="filter-pill px-3 py-1.5 border-0 rounded-2 ft-4 fw-medium transition-all"
      [class.active-filter]="activeFilter === 'Honeymoon'"
      (click)="applyFilter('Honeymoon')"
    >
      Honeymoon
    </button>
  </section>

  <!-- Responsive Services Layout Grid -->
  <section class="row g-3 flex-grow-1 scroll-verticle style-1">
    <div
      class="col-12 col-md-6 col-xl-4"
      *ngFor="let request of filteredRequests"
    >
   <div
  class="card bg-6th border-6th rounded-3 p-2 shadow-sm position-relative d-flex flex-column justify-content-between compact-card"
>
  <!-- Top Row Profile Information Meta Section -->
  <div class="d-flex align-items-start gap-2 mb-2">
    <img
      [src]="request.image"
      [alt]="request.name"
      class="service-avatar rounded-2 object-fit-cover"
    />
    <div class="flex-grow-1 min-w-0">
      <h3
        class="fh-6 txt-8th m-0 mb-1 pe-5 tooltip-top compact-name"
        [attr.data-tooltip]="request.name"
      >
        <span
          class="d-inline-block text-truncate"
          style="max-width: 100%; vertical-align: bottom"
        >
          {{ request.name }}
        </span>
      </h3>
      <p class="ft-4 txt-7th m-0 d-flex align-items-center gap-1 compact-location">
        <i class="bi bi-geo-alt-fill text-muted"></i>
        {{ request.location }}
      </p>
    </div>

    <!-- Category Pill Tag (Pink Tag Style from image) -->
    <span
      class="badge-category px-2 py-1 rounded-pill ft-5 fw-semibold position-absolute end-3"
    >
      {{ request.category }}
    </span>
  </div>

  <!-- Full Width Main Action Footer Button -->
  <div class="pt-1 mt-auto">
    <button
      type="button"
      class="w-100 rounded-3 border-0 bg-2nd txt-6th ft-3 d-flex align-items-center justify-content-center gap-2 main-action-btn compact-btn"
      (click)="onContactUser(request)"
    >
      Contact user
    </button>
  </div>
</div>
    </div>

    <!-- Empty Layout Fallback state definition logic -->
    <div
      class="col-12 text-center py-5 mt-4"
      *ngIf="filteredRequests.length === 0"
    >
      <p class="ft-2 txt-7th m-0">
        No open requests found matching the "{{ activeFilter }}" filter
        criteria.
      </p>
    </div>
  </section>
</main>
