<main class="container-fluid p-4 h-100 scroll-verticle position-relative">
  
  <!-- Header block -->
  <header class="d-flex justify-content-between align-items-start mb-4">
    <div class="dashboard-header">
      <h1 class="fh-3 txt-8th m-0">Event Gallery</h1>
      <p class="ft-3 txt-7th mt-1 mb-0">Manage your event gallery.</p>
    </div>
    <button type="button" class="btn bg-2nd txt-6th px-4 py-2 rounded-2 ft-3 fw-medium accent-btn" (click)="openUploadModal()">
      Add new Event
    </button>
  </header>

  <!-- Search Area -->
  <section class="mb-4 max-w-search">
    <div class="position-relative">
      <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 txt-7th ft-3"></i>
      <input 
        type="text" 
        class="form-control ps-5 py-2 ft-3 border bg-6th rounded-3 custom-search-input" 
        placeholder="Search"
        [(ngModel)]="searchQuery"
        (input)="onSearchChange()">
    </div>
  </section>

  <!-- Gallery Grid Layout (Full Image Cards) -->
  <section class="row g-4">
    <div class="col-12 col-md-6 col-xl-4" *ngFor="let event of filteredEvents">
      <div class="card border-0 rounded-3 overflow-hidden shadow-sm h-100 position-relative gallery-card-full">
        
        <!-- Full-Width Background Image Asset -->
        <img [src]="event.imageUrl" [alt]="event.title" class="object-fit-cover w-100 h-100 position-absolute top-0 start-0 design-image-bg">
        
        <!-- Gradient Text Backdrop Overlay Layer -->
        <div class="gradient-overlay position-absolute bottom-0 start-0 w-100 p-3 d-flex flex-column justify-content-end z-index-1">
          <h3 class="fh-6 text-white m-0 mb-1 font-title-card">{{ event.title }}</h3>
          <p class="ft-4 text-white-50 m-0 d-flex align-items-center gap-1">
            <i class="bi bi-geo-alt-fill text-white-50"></i> 
            {{ event.city }}
          </p>
        </div>

        <!-- Floating Action Controls Box (Top Right Overlay Pill Container) -->
        <div class="position-absolute top-3 end-3 bg-white rounded-3 p-1.5 d-flex gap-2 action-badge-container z-index-2">
          <button type="button" class="btn-action-pushed border-0 bg-transparent p-1 d-flex align-items-center justify-content-center" (click)="onEditEvent(event)" title="Edit Event">
            <i class="bi bi-pencil-square text-primary-custom"></i>
          </button>
          <div class="vertical-divider"></div>
          <button type="button" class="btn-action-pushed border-0 bg-transparent p-1 d-flex align-items-center justify-content-center" (click)="onDeleteEvent(event)" title="Delete Event">
            <i class="bi bi-trash3 text-danger-custom"></i>
          </button>
        </div>

      </div>
    </div>
  </section>

  <!-- Upload Event Gallery Modal stays exactly the same -->
  <div class="modal-backdrop-custom position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" *ngIf="isModalOpen">
    <div class="modal-window bg-light-gray rounded-4 p-4 position-relative d-flex flex-column justify-content-between">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h2 class="fh-4 txt-8th m-0 fw-bold">Upload Event Gallery</h2>
          <p class="ft-4 txt-7th m-0 mt-1">Add a new photo to the public events gallery</p>
        </div>
        <button type="button" class="border-0 bg-transparent close-x txt-7th fs-4" (click)="closeUploadModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="bg-white rounded-4 p-4 flex-grow-1 border-white-container mb-3 shadow-sm">
        <div class="mb-4">
          <label class="text-uppercase tracking-wider ft-6 txt-7th d-block mb-2 fw-bold">Event Photo</label>
          <div class="upload-dropzone border-dashed rounded-3 p-4 text-center d-flex flex-column align-items-center justify-content-center position-relative" (click)="triggerFileInput()">
            <div class="upload-icon-circle bg-light border-0 rounded-circle mb-2 d-flex align-items-center justify-content-center">
              <i class="bi bi-cloud-arrow-up fs-4"></i>
            </div>
            <h5 class="ft-3 txt-8th fw-bold m-0 mb-1">Tap to Upload Image</h5>
            <p class="ft-5 txt-7th m-0">JPEG, PNG up to 10MB</p>
            <input type="file" #fileInput class="d-none" (change)="onFileSelected($event)" accept="image/jpeg, image/png">
          </div>
        </div>

        <div class="mb-4">
          <label class="text-uppercase tracking-wider ft-6 txt-7th d-block mb-2 fw-bold">Service Title</label>
          <input type="text" class="form-control form-input-custom px-3 py-2.5 ft-4 border-0 rounded-3" placeholder="e.g. Royal Wedding Reception" [(ngModel)]="newEvent.title">
        </div>

        <div class="row g-3">
          <div class="col-6">
            <label class="text-uppercase tracking-wider ft-6 txt-7th d-block mb-2 fw-bold">Event Country</label>
            <select class="form-select form-input-custom px-3 py-2.5 ft-4 border-0 rounded-3" [(ngModel)]="newEvent.country">
              <option value="" disabled selected hidden>e.g Pakistan</option>
              <option value="Pakistan">Pakistan</option>
            </select>
          </div>
          <div class="col-6">
            <label class="text-uppercase tracking-wider ft-6 txt-7th d-block mb-2 fw-bold">Event City</label>
            <select class="form-select form-input-custom px-3 py-2.5 ft-4 border-0 rounded-3" [(ngModel)]="newEvent.city">
              <option value="" disabled selected hidden>e.g Islamabad</option>
              <option value="Islamabad">Islamabad</option>
              <option value="Lahore">Lahore</option>
            </select>
          </div>
        </div>
      </div>

      <div>
        <button type="button" class="w-100 py-3 rounded-3 border-0 bg-2nd txt-6th ft-3 fw-medium d-flex align-items-center justify-content-center gap-2 main-publish-btn" (click)="onPublishEvent()">
          <i class="bi bi-cloud-arrow-up"></i> Publish to gallery
        </button>
      </div>
    </div>
  </div>

</main>
