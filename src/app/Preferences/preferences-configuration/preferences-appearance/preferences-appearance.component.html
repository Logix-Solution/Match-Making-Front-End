<div class="fh-5 fw-bold mt-3">Appearance</div>

<!-- row-01 -->
<div class="row g-2 align-items-end mt-4">

  <!-- Preferred Min Height (typeID=26) -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Preferred Min Height<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedMinHeight"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select height</option>
        <option *ngFor="let item of appearanceHeightList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Preferred Max Height (typeID=26) -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Preferred Max Height<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedMaxHeight"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select height</option>
        <option *ngFor="let item of appearanceHeightList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Open to Partner with Disabilities (typeID=30) -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Open to Partner with Disabilities<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedDisability"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select option</option>
        <option *ngFor="let item of disabilityList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

</div>

<!-- row-02 (Preferred Body Type Tags Selection) -->
<div class="row mt-4">
  <div class="col-md-12">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Preferred Body Type<span class="text-danger">&nbsp;*</span>
        <span class="ft-6 txt-7th text-lowercase">&nbsp;(select up to 3, in priority order)</span>
      </label>

      <div class="d-flex flex-wrap gap-2 mt-3">
        <span
          *ngFor="let item of bodyTypeList"
          class="badge p-2 border rounded-pill"
          [ngClass]="isBodyTypeSelected(item.subTypeID)
            ? 'bg-light text-danger border-danger'
            : 'bg-light text-dark'"
          style="cursor: pointer; font-size: 13px;"
          (click)="toggleBodyType(item.subTypeID)">
          {{ item.subTypeTitle }}
          <span *ngIf="isBodyTypeSelected(item.subTypeID)">
            &nbsp;({{ getBodyTypePriority(item.subTypeID) }})
          </span>
        </span>
      </div>
    </div>
  </div>
</div>

<!-- row-03 (Body Type Priority Selectors — auto-filled from pill selection order) -->
<div class="row g-2 align-items-end mt-4">

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        First Priority
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        disabled
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option>{{ getBodyTypeTitle(selectedBodyTypes[0]) || 'Not selected yet' }}</option>
      </select>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Second Priority
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        disabled
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option>{{ getBodyTypeTitle(selectedBodyTypes[1]) || 'Not selected yet' }}</option>
      </select>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Third Priority
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        disabled
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option>{{ getBodyTypeTitle(selectedBodyTypes[2]) || 'Not selected yet' }}</option>
      </select>
    </div>
  </div>

</div>
