<div class="fh-5 fw-bold mt-3">Personal preference</div>

<!-- Row 1: Country, City, Min Age, Max Age -->
<div class="row g-2 align-items-start mt-4">

  <!-- Preferred Country -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Preferred Country<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="countryList"
        bindLabel="country_name"
        bindValue="country_id"
        placeholder="Select Country"
        searchPlaceholder="Search country..."
        [(ngModel)]="selectedCountry"
        (ngModelChange)="onCountryChange()"
        (touched)="markTouched('country')"
      ></app-searchable-select>
      <div class="field-error">{{ countryError }}</div>
    </div>
  </div>

  <!-- Preferred City -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Preferred City<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="cityList"
        bindLabel="city_name"
        bindValue="city_id"
        placeholder="Select City"
        searchPlaceholder="Search city..."
        [(ngModel)]="selectedCity"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('city')"
      ></app-searchable-select>
      <div class="field-error">{{ cityError }}</div>
    </div>
  </div>

  <!-- Preferred Min Age (typeID=31) -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Preferred Min Age<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="minAgeList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Min Age"
        searchPlaceholder="Search age..."
        [(ngModel)]="selectedMinAge"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('minAge')"
      ></app-searchable-select>
      <div class="field-error">{{ minAgeError }}</div>
    </div>
  </div>

  <!-- Preferred Max Age (typeID=32) -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Preferred Max Age<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="maxAgeList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Max Age"
        searchPlaceholder="Search age..."
        [(ngModel)]="selectedMaxAge"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('maxAge')"
      ></app-searchable-select>
      <div class="field-error">{{ maxAgeError }}</div>
    </div>
  </div>

</div>

<!-- Row 2: Nationality, Caste, Ethnicity -->
<div class="row g-2 align-items-start mt-4">

  <!-- Preferred Nationality — bound to countryList, same pattern as ProfilePersonalInfoInputComponent -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Preferred Nationality<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="countryList"
        bindLabel="nationality"
        bindValue="country_id"
        placeholder="Select a nationality"
        searchPlaceholder="Search nationality..."
        [(ngModel)]="selectedNationality"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('nationality')"
      ></app-searchable-select>
      <div class="field-error">{{ nationalityError }}</div>
    </div>
  </div>

  <!-- Preferred Caste (→ personalPrefrence JSON only) -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Preferred Caste<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="castList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select a caste"
        searchPlaceholder="Search caste..."
        [(ngModel)]="selectedCast"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('cast')"
      ></app-searchable-select>
      <div class="field-error">{{ castError }}</div>
    </div>
  </div>

  <!-- Preferred Ethnicity (→ personalPrefrence JSON only) -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Preferred Ethnicity<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="ethnicityList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select an ethnicity"
        searchPlaceholder="Search ethnicity..."
        [(ngModel)]="selectedEthnicity"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('ethnicity')"
      ></app-searchable-select>
      <div class="field-error">{{ ethnicityError }}</div>
    </div>
  </div>

</div>
