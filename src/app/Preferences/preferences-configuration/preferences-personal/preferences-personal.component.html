<div class="fh-5 fw-bold mt-3">Personal preference</div>

<!-- Row 1: Country, City, Min Age, Max Age -->
<div class="row g-2 align-items-end mt-4">

  <!-- Preferred Country -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Preferred Country<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedCountry"
        (change)="onCountryChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Country</option>
        <option *ngFor="let item of countryList" [value]="item.country_id">
          {{ item.country_name }}
        </option>
      </select>
    </div>
  </div>

  <!-- Preferred City -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Preferred City<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedCity"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select City</option>
        <option *ngFor="let item of cityList" [value]="item.city_id">
          {{ item.city_name }}
        </option>
      </select>
    </div>
  </div>

  <!-- Preferred Min Age (typeID=31) -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Preferred Min Age<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedMinAge"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Min Age</option>
        <option *ngFor="let item of minAgeList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Preferred Max Age (typeID=32) -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1" style="font-size: 11px;">
        Preferred Max Age<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedMaxAge"
        (change)="onFieldChange()"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Max Age</option>
        <option *ngFor="let item of maxAgeList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

</div>

<!-- Row 2: Nationality, Caste, Ethnicity -->

        <option value="">Select a nationality</option>

        <option value="">Select an ethnicity</option>

        </option>
      </select>
    </div>
  </div>

</div>
