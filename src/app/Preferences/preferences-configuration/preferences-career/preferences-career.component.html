<div class="fh-5 fw-bold mt-3">Education & Career</div>

<!-- row-01 -->
<div class="row mt-4">
  <div class="col-md-6">
    <div class="form-group">
      <label for="minEducation" class="txt-7th ft-5">Minimum Education Level<span class="txt-2nd">&nbsp;*</span></label>
      <input type="text" class="form-control form-control-sm mt-2" id="minEducation" placeholder="Enter proffered min age">
    </div>
  </div>
  
  <div class="col-md-6">
    <div class="form-group">
      <label for="minIncome" class="txt-7th ft-5">Minimum Monthly Income<span class="txt-2nd">&nbsp;*</span></label>
      <input type="text" class="form-control form-control-sm mt-2" id="minIncome" placeholder="Enter proffered max age">
    </div>
  </div>
</div>

<!-- row-02 (Preferred Occupations Selection) -->

        <span class="badge bg-light text-dark p-2 border">Student</span>
        <!-- Active/Selected option state style placeholder -->
        <span class="badge bg-light text-danger p-2 border border-danger">Doctor</span>
        <span class="badge bg-light text-dark p-2 border">Nurse</span>
        <span class="badge bg-light text-dark p-2 border">Engineer</span>
        <span class="badge bg-light text-dark p-2 border">Teacher</span>
        <span class="badge bg-light text-dark p-2 border">Professor</span>
        <span class="badge bg-light text-dark p-2 border">Business Owner</span>
        <span class="badge bg-light text-dark p-2 border">Entrepreneur</span>
        <span class="badge bg-light text-dark p-2 border">Consultant</span>
        <span class="badge bg-light text-dark p-2 border">Banker</span>
        <span class="badge bg-light text-dark p-2 border">Accountant</span>
        <span class="badge bg-light text-dark p-2 border">Government Employee</span>
        <span class="badge bg-light text-dark p-2 border">Lawyer</span>
        <span class="badge bg-light text-dark p-2 border">Generalist</span>
        <span class="badge bg-light text-dark p-2 border">IT Professor</span>
        <span class="badge bg-light text-dark p-2 border">Farmer</span>
        <span class="badge bg-light text-dark p-2 border">Freelancer</span>
        <span class="badge bg-light text-dark p-2 border">Artist</span>
        <span class="badge bg-light text-dark p-2 border">Self-made</span>
      </div>
    </div>
  </div>
</div>

<!-- row-03 (Priority Selectors) -->
<div class="row mt-4">
  <div class="col-md-4">
    <div class="form-group">
      <label for="firstPriority" class="txt-7th ft-5">First Priority</label>
      <select class="form-control form-control-sm mt-2" id="firstPriority">
        <option>Doctor</option>
      </select>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label for="secondPriority" class="txt-7th ft-5">Second Priority</label>
      <select class="form-control form-control-sm mt-2" id="secondPriority">
        <option value="" disabled selected>Select profession</option>
      </select>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label for="thirdPriority" class="txt-7th ft-5">Third Priority</label>
      <select class="form-control form-control-sm mt-2" id="thirdPriority">
        <option value="" disabled selected>Select profession</option>
