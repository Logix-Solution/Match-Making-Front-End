<div class="fh-5 fw-bold mt-3">Appearance</div>

<div class="row mt-4 align-items-start">

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Height<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="heightList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Height"
        searchPlaceholder="Search height..."
        [(ngModel)]="selectedHeight"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('height')"
      ></app-searchable-select>
      <div class="field-error">{{ heightError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Body Type<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="bodyTypeList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Body Type"
        searchPlaceholder="Search body type..."
        [(ngModel)]="selectedBodyType"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('bodyType')"
      ></app-searchable-select>
      <div class="field-error">{{ bodyTypeError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Skin Tone<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="skinToneList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Skin Tone"
        searchPlaceholder="Search skin tone..."
        [(ngModel)]="selectedSkinTone"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('skinTone')"
      ></app-searchable-select>
      <div class="field-error">{{ skinToneError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Disability<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="disabilityList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Disability"
        searchPlaceholder="Search disability..."
        [(ngModel)]="selectedDisability"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('disability')"
      ></app-searchable-select>
      <div class="field-error">{{ disabilityError }}</div>
    </div>
  </div>

</div>

<div class="row mt-4" *ngIf="isDisabilityYes()">
  <div class="col-md-12">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Disabilities (If Yes)<span class="text-danger">&nbsp;*</span>
      </label>
      <textarea
        class="form-control border-0 p-3 bg-white"
        rows="4"
        placeholder="Please describe your disabilities.........."
        [(ngModel)]="disabilityDescription"
        (ngModelChange)="onFieldChange()"
        (blur)="markTouched('disabilityDescription')"
        style="border-radius: 16px; font-size: 13px; background-color: #f8f9fa;">
      </textarea>
      <div class="field-error">{{ disabilityDescriptionError }}</div>
    </div>
  </div>
</div>
