<div class="fh-5 fw-bold mt-3">Appearance</div>

<div class="row mt-4 align-items-start">

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Height<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedHeight"
        (change)="onFieldChange(); markTouched('height')"
        (blur)="markTouched('height')"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Height</option>
        <option *ngFor="let item of heightList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
      <div class="field-error">{{ heightError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Body Type<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedBodyType"
        (change)="onFieldChange(); markTouched('bodyType')"
        (blur)="markTouched('bodyType')"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Body Type</option>
        <option *ngFor="let item of bodyTypeList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
      <div class="field-error">{{ bodyTypeError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Skin Tone<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedSkinTone"
        (change)="onFieldChange(); markTouched('skinTone')"
        (blur)="markTouched('skinTone')"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Skin Tone</option>
        <option *ngFor="let item of skinToneList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
      <div class="field-error">{{ skinToneError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Disability<span class="text-danger">&nbsp;*</span>
      </label>
      <select
        class="form-select border-0 px-3 rounded-pill"
        [(ngModel)]="selectedDisability"
        (change)="onFieldChange(); markTouched('disability')"
        (blur)="markTouched('disability')"
        style="height: 42px; font-size: 13px; appearance: none !important;">
        <option value="">Select Disability</option>
        <option *ngFor="let item of disabilityList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
      <div class="field-error">{{ disabilityError }}</div>
    </div>
  </div>

</div>

<div class="row mt-4" *ngIf="isDisabilityYes()">
  <div class="col-md-12">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Disabilities (If Yes)<span class="text-danger">&nbsp;*</span>
      </label>
      <textarea
        class="form-control border-0 p-3 bg-white"
        rows="4"
        placeholder="Please describe your disabilities.........."
        [(ngModel)]="disabilityDescription"
        (ngModelChange)="onFieldChange()"
        (blur)="markTouched('disabilityDescription')"
        style="border-radius: 16px; font-size: 13px; background-color: #f8f9fa;">
      </textarea>
      <div class="field-error">{{ disabilityDescriptionError }}</div>
    </div>
  </div>
</div>
