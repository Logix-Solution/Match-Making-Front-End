<div class="fh-5 fw-bold mt-3">Education & Career</div>

<!-- Row 1: Education + Institution -->
<div class="row mt-4 align-items-start">

  <!-- Education Level typeID=4 -->
  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Education Level<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="educationList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Education Level"
        searchPlaceholder="Search education..."
        [(ngModel)]="selectedEducation"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('education')"
      ></app-searchable-select>
      <div class="field-error">{{ educationError }}</div>
    </div>
  </div>

  <!-- Institution Name -->
  <div class="col-md-9">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Institution Name<span class="text-danger">&nbsp;*</span>
      </label>
      <input
        type="text"
        class="form-control border-0 px-3 rounded-pill"
        placeholder="Enter your institution name"
        [(ngModel)]="instituteName"
        (ngModelChange)="onFieldChange()"
        (blur)="markTouched('institute')"
        style="height: 42px; font-size: 13px;"
      />
      <div class="field-error">{{ instituteError }}</div>
    </div>
  </div>

</div>
