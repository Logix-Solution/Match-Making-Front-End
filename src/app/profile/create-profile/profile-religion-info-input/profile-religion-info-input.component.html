<div class="fh-5 fw-bold mt-3">Religious Background</div>
<div class="row mt-4">

  <!-- Religion typeID=7 -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-5">
        Religion<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedReligion"
        (change)="onFieldChange()">
        <option value="">Select Religion</option>
        <option *ngFor="let item of religionList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Sect typeID=8 -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-5">
        SECT<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedSect"
        (change)="onFieldChange()">
        <option value="">Select Sect</option>
        <option *ngFor="let item of sectList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Religion Importance typeID=9 -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-5">
        How Important is Religion to you?<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedReligionImportance"
        (change)="onFieldChange()">
        <option value="">Select Importance</option>
        <option *ngFor="let item of religionImportanceList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

</div>
