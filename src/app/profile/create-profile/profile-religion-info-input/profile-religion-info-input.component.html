<div class="fh-5 fw-bold mt-3">Religious Background</div>

<div class="row mt-4 align-items-start">

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Religion<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="religionList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Religion"
        searchPlaceholder="Search religion..."
        [(ngModel)]="selectedReligion"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('religion')"
      ></app-searchable-select>
      <div class="field-error">{{ religionError }}</div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Sect<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="sectList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Sect"
        searchPlaceholder="Search sect..."
        [(ngModel)]="selectedSect"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('sect')"
      ></app-searchable-select>
      <div class="field-error">{{ sectError }}</div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        How Important is Religion to you?<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="religionImportanceList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Importance"
        searchPlaceholder="Search..."
        [(ngModel)]="selectedReligionImportance"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('religionImportance')"
      ></app-searchable-select>
      <div class="field-error">{{ religionImportanceError }}</div>
    </div>
  </div>

</div>
