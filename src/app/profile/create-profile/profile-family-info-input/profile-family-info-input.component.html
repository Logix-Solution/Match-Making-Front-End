<div class="fh-5 fw-bold mt-3">Family & Lifestyle</div>

<!-- row - 01 -->
<div class="row mt-4">

  <!-- Marital Status typeID=10 -->
  <div class="col-md-2">
    <div class="form-group">
      <label class="txt-7th ft-5">
        Marital Status<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedMaritalStatus"
        (change)="onFieldChange()">
        <option value="">Select Marital Status</option>
        <option *ngFor="let item of maritalStatusList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Housing Situation typeID=11 -->
  <div class="col-md-2">
    <div class="form-group">
      <label class="txt-7th ft-5">
        Housing Situation<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedHousingSituation"
        (change)="onFieldChange()">
        <option value="">Select Housing Situation</option>
        <option *ngFor="let item of housingSituationList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Father Occupation typeID=12 -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-5">
        Father's Occupation<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedFatherOccupation"
        (change)="onFieldChange()">
        <option value="">Select Father's Occupation</option>
        <option *ngFor="let item of fatherOccupationList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Mother Occupation typeID=13 -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-5">
        Mother's Occupation<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedMotherOccupation"
        (change)="onFieldChange()">
        <option value="">Select Mother's Occupation</option>
        <option *ngFor="let item of motherOccupationList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>
</div>

<!-- row - 02 -->
<div class="row mt-4">

  <!-- Parent Phone Number -->
<div class="col-md-2">
  <div class="row">
    <label class="txt-7th ft-5">
      Parent Phone Number<span class="txt-2nd">&nbsp;*</span>
    </label>
    <div class="col-md-4">
      <div class="form-group">
        <select
          class="form-control form-control-sm mt-2"
          [(ngModel)]="selectedParentCountryCode"
          (change)="onFieldChange()">
          <option value="">Code</option>
          <option *ngFor="let item of countryList" [value]="item.country_code">
            {{ item.country_code }}
          </option>
        </select>
      </div>
    </div>
    <div class="col-md-8">
      <input
        type="text"
        class="form-control form-control-sm mt-2"
        placeholder="Enter phone number"
        [(ngModel)]="parentPhoneNumber"
        (ngModelChange)="onFieldChange()"
      />
    </div>
  </div>
</div>

  <!-- No of Siblings typeID=25 -->
  <div class="col-md-2">
    <div class="form-group">
      <label class="txt-7th ft-5">
        No. of Siblings<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedNoOfSiblings"
        (change)="onFieldChange()">
        <option value="">Select No. of Siblings</option>
        <option *ngFor="let item of noOfSiblingsList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

  <!-- Family Involvement typeID=14 -->
  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-5">
        Family Involvement Presence<span class="txt-2nd">&nbsp;*</span>
      </label>
      <select
        class="form-control form-control-sm mt-2"
        [(ngModel)]="selectedFamilyInvolvement"
        (change)="onFieldChange()">
        <option value="">Select Family Involvement</option>
        <option *ngFor="let item of familyInvolvementList" [value]="item.subTypeID">
          {{ item.subTypeTitle }}
        </option>
      </select>
    </div>
  </div>

</div>
