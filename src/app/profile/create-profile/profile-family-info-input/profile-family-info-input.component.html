<div class="fh-5 fw-bold mt-3">Family Profile</div>

<div class="row mt-4 align-items-start">

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Marital Status<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="maritalStatusList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Marital Status"
        searchPlaceholder="Search marital status..."
        [(ngModel)]="selectedMaritalStatus"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('maritalStatus')"
      ></app-searchable-select>
      <div class="field-error">{{ maritalStatusError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Housing Situation<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="housingSituationList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Housing Situation"
        searchPlaceholder="Search housing..."
        [(ngModel)]="selectedHousingSituation"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('housingSituation')"
      ></app-searchable-select>
      <div class="field-error">{{ housingSituationError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Father's Occupation<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="fatherOccupationList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Father's Occupation"
        searchPlaceholder="Search occupation..."
        [(ngModel)]="selectedFatherOccupation"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('fatherOccupation')"
      ></app-searchable-select>
      <div class="field-error">{{ fatherOccupationError }}</div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Mother's Occupation<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="motherOccupationList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Mother's Occupation"
        searchPlaceholder="Search occupation..."
        [(ngModel)]="selectedMotherOccupation"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('motherOccupation')"
      ></app-searchable-select>
      <div class="field-error">{{ motherOccupationError }}</div>
    </div>
  </div>
</div>

<div class="row mt-4 align-items-start">

  <div class="col-md-4">
    <div class="row">
      <div class="col-12">
        <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
          Parent Phone Number<span class="text-danger">&nbsp;*</span>
        </label>
      </div>
      <div class="col-4">
        <div class="form-group">
          <app-searchable-select
            [items]="countryList"
            bindLabel="country_code"
            bindValue="country_code"
            placeholder="Code"
            searchPlaceholder="Search code..."
            [(ngModel)]="selectedParentCountryCode"
            (ngModelChange)="onFieldChange()"
            (touched)="markTouched('parentCountryCode')"
          ></app-searchable-select>
          <div class="field-error">{{ parentCountryCodeError }}</div>
        </div>
      </div>
      <div class="col-8">
        <div class="form-group">
          <input
            type="text"
            class="form-control border-0 px-3 rounded-pill"
            placeholder="Enter phone number"
            [(ngModel)]="parentPhoneNumber"
            (ngModelChange)="onFieldChange()"
            (blur)="markTouched('parentPhoneNumber')"
            style="height: 42px; font-size: 13px;"
          />
          <div class="field-error">{{ parentPhoneNumberError }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        No. of Siblings<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="noOfSiblingsList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select No. of Siblings"
        searchPlaceholder="Search siblings..."
        [(ngModel)]="selectedNoOfSiblings"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('noOfSiblings')"
      ></app-searchable-select>
      <div class="field-error">{{ noOfSiblingsError }}</div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="form-group">
      <label class="txt-7th ft-6 fw-bold text-uppercase mb-1 field-label">
        Family Involvement Presence<span class="text-danger">&nbsp;*</span>
      </label>
      <app-searchable-select
        [items]="familyInvolvementList"
        bindLabel="subTypeTitle"
        bindValue="subTypeID"
        placeholder="Select Family Involvement"
        searchPlaceholder="Search involvement..."
        [(ngModel)]="selectedFamilyInvolvement"
        (ngModelChange)="onFieldChange()"
        (touched)="markTouched('familyInvolvement')"
      ></app-searchable-select>
      <div class="field-error">{{ familyInvolvementError }}</div>
    </div>
  </div>

</div>
