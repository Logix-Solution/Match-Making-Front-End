<!-- Top nav: visible on public routes only -->
 <app-page-loader ></app-page-loader>
<app-top-nav *ngIf="showNav"></app-top-nav>
 
<!-- Side nav (contains router-outlet internally) -->
<app-side-nav *ngIf="showSideNav"></app-side-nav>
 
<!-- Regular outlet when no side nav -->

<router-outlet *ngIf="!showSideNav"></router-outlet>
