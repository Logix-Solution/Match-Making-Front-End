<section class="services-section py-5 bg text-center position-relative h-100">
  <div class="container-xl px-4 px-lg-5">

    <!-- Section Header -->
    <h2 class="fw-bold mb-2 custom-font" style="color: black !important;">Our Premium Services</h2>
    <div class="mb-5 ft-9"  style="color: #45556C ; font-weight: 400px !important;">
      Beyond matchmaking, we provide end-to-end support for your journey to a happy marriage.
    </div>

    <!-- Overlapping Card Pairs Row -->
    <div class="d-flex justify-content-center align-items-start gap-5 flex-wrap">

      <!-- LEFT PAIR: Matchmaking + Event Planning -->
      <div class="card-pair-group">

        <!-- Card 1 back: Matchmaking -->
        <div
          class="service-card card-back rounded-4 overflow-hidden cursor-pointer"
         (click)="openOverlay(services[0])"

          [style.backgroundImage]="'url(' + services[0].imageUrl + ')'"
        >
          <!-- <div class="card-overlay d-flex align-items-end p-3">
            <h4 class="text-white fw-semibold m-0">{{ services[0].title }}</h4>
          </div> -->
        </div>

        <!-- Card 2 front: Event Planning -->
        <div
          class="service-card card-front rounded-4 overflow-hidden cursor-pointer"
          (click)="openOverlay(services[1])"

          [style.backgroundImage]="'url(' + services[1].imageUrl + ')'"
        >
          <!-- <div class="card-overlay d-flex align-items-end p-3">
            <h4 class="text-white fw-semibold m-0">{{ services[1].title }}</h4>
          </div> -->
        </div>

      </div>

      <!-- RIGHT PAIR: Destination Wedding + Honeymoon -->
      <div class="card-pair-group">

        <!-- Card 3 back: Destination Wedding -->
        <div
          class="service-card card-back rounded-4 overflow-hidden cursor-pointer"
       (click)="openOverlay(services[2])"

          [style.backgroundImage]="'url(' + services[2].imageUrl + ')'"
        >
          <!-- <div class="card-overlay d-flex align-items-end p-3">
            <h4 class="text-white fw-semibold m-0">{{ services[2].title }}</h4>
          </div> -->
        </div>

        <!-- Card 4 front: Honeymoon -->
        <div
          class="service-card card-front rounded-4 overflow-hidden cursor-pointer"
          (click)="openOverlay(services[3])"

          [style.backgroundImage]="'url(' + services[3].imageUrl + ')'"
        >
          <!-- <div class="card-overlay d-flex align-items-end p-3">
            <h4 class="text-white fw-semibold m-0">{{ services[3].title }}</h4>
          </div> -->
        </div>

      </div>

    </div>
  </div>
</section>

<!-- ── Modal ──────────────────────────────────────────────────────────────── -->
<div
  class="custom-modal-backdrop  position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center "
  [class.show]="isModalOpen"
  *ngIf="isModalOpen"
  (click)="closeOverlay()"
>
  <div class="modal-window bg-white rounded-4 shadow-lg  position-relative" (click)="$event.stopPropagation()">

    <!-- Close btn -->
    <button
      type="button"
      class="btn-close position-absolute top-0 end-0 m-3"
      style="z-index:10;"
      (click)="closeOverlay()"
      aria-label="Close">
    </button>

    <div class="modal-body p-4 p-md-5 flex-grow-1 scroll-verticle style-1 " style="max-height: 95vh;">

  <!-- ── Title ─────────────────────────────────────────────────────── -->
<div class="text-center mb-3">
  <h2 class="modal-service-title txt-primary  mb-3">
    {{ selectedService?.title | uppercase }}
  </h2>
  <div class="modal-divider d-flex align-items-center justify-content-center gap-2">
    <span class="divider-diamond txt-primary">&#9670;</span>
    <div class="divider-line"></div>
    <span class="divider-diamond txt-primary">&#9670;</span>
  </div>
</div>

<!-- ── Loading ───────────────────────────────────────────────────── -->
<div *ngIf="isLoading" class="text-center py-4">
  <div class="spinner-border txt-primary" role="status"></div>
</div>

<!-- ── Slider ─────────────────────────────────────────────────────── -->
<div class="mb-2" *ngIf="!isLoading && modalEvents.length > 0">
  <h5 class="fw-bold text-start mb-3 fs-6">Top Previous Events</h5>

  <div class="d-flex align-items-center gap-2">
    <!-- Prev arrow -->
    <button
      class="slider-arrow flex-shrink-0"
      (click)="prevSlide()"
      [disabled]="currentSlide === 0">
      <i class="bi bi-chevron-left"></i>
    </button>

    <!-- Slides viewport -->
    <div class="slider-viewport flex-grow-1 overflow-hidden">
      <div class="slider-track d-flex gap-2"
           [style.transform]="'translateX(calc(-' + currentSlide + ' * (100% / 3 + 8px)))'">
        <div
          *ngFor="let event of modalEvents"
          class="slider-slide flex-shrink-0">
          <div class="ratio ratio-4x3 rounded-3 overflow-hidden position-relative">
            <img [src]="event.eDoc" [alt]="event.eventTitle" class="w-100 h-100 object-fit-cover" />
            <!-- City & Country overlay -->
            <div class="position-absolute bottom-0 start-0 w-100 px-2 py-1"
                 style="background:rgba(0,0,0,0.5);">
              <div class="text-white" style="font-size:0.7rem; line-height:1.3;">
                <i class="bi bi-geo-alt-fill me-1"></i>
                {{ event.cityName }}, {{ event.countryName }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Next arrow -->
    <button
      class="slider-arrow flex-shrink-0"
      (click)="nextSlide()"
      [disabled]="currentSlide >= modalEvents.length - visibleCount">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>

  <!-- Dot indicators -->
  <div class="d-flex justify-content-center gap-2 mt-3">
    <span
      *ngFor="let dot of sliderDots; let i = index"
      class="slider-dot"
      [class.active]="i === currentSlide"
      (click)="currentSlide = i">
    </span>
  </div>
</div>

<!-- ── Description ────────────────────────────────────────────────── -->
<div class="text-center px-2 mb-4 mt-4 fs-6 text-secondary" *ngIf="eventDescription">
  <p class="m-0" style="white-space: pre-line;">{{ eventDescription }}</p>
</div>

<!-- ── Send Interest button ───────────────────────────────────────── -->
<div class="d-grid col-12 col-md-10 mx-auto">
  <button
    class="btn btn-lg d-flex align-items-center justify-content-center gap-2 py-3 rounded-3 text-white fw-semibold"
    style="border: none;"
    [style.background-color]="interestStatusID === 1 ? '#c94a30' : '#6c757d'"
    [disabled]="isSendingInterest"
    (click)="sendInterest()">
    <span *ngIf="isSendingInterest" class="spinner-border spinner-border-sm me-1"></span>
    <i *ngIf="!isSendingInterest" class="bi bi-whatsapp fs-5"></i>
    {{ isSendingInterest ? 'Please wait...' : (interestStatusID === 1 ? 'Send Interest' : 'Withdraw Interest') }}
  </button>
</div>

<!-- No events fallback -->
<div *ngIf="!isLoading && modalEvents.length === 0" class="text-center text-secondary py-3">
  No events found.
</div>

    </div>
  </div>
</div>
