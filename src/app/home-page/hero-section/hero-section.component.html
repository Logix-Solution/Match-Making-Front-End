<section class="hero-section d-flex  align-items-center position-relative overflow-hidden w-100 h-100">

  <div class="hero-bg-layer"
       *ngFor="let bg of bgImages; let i = index"
       [style.backgroundImage]="'url(' + bg + ')'"
       [class.active]="i === activeBg">
  </div>

  <div class="hero-overlay"></div>

  <div class="hero-content w-100">
    <div class="container">
      <div class="row align-items-center text-center">
        <div class="col-12">
          
          <h1 class="hero-title mb-5">
            Find Your Perfect <span class="txt-primary fh-7">Life Partner</span> with Trusted <br> Matchmaking
          </h1>

          <div class="row align-items-start mt-4">
            
            <div class="col-md-7 text-start d-flex flex-column gap-4 mt-5">
              <div class="d-flex align-items-center gap-3">
                <div class="avatars-stack flex-shrink-0">
                  <img
                    *ngFor="let avatar of visibleAvatars; let i = index"
                    [src]="avatar"
                    [style.zIndex]="10 - i"
                    [style.left.px]="i * 22"
                    class="couple-avatar"
                    alt="happy couple" />
                </div>
                <div class="d-flex flex-column">
                  <span class="fw-bold fs-6" style="color: rgba(255, 65, 108, 0.95);">23,000+ Happy Couples</span>
                  <span class="small" style="color: rgba(255,255,255,0.75);">Successfully matched and married</span>
                </div>
              </div>

              <p class="hero-tagline mb-0">
                Discover Compatible Connections with Confidence
              </p>
            </div>

            <div class="col-md-5 d-flex justify-content-end">
              <div class="heart-card text-center" [class.heart-visible]="heartVisible">
                <img
                  [src]="heartImages[activeHeart]"
                  alt="couple"
                  class=" mb-3" />
                <p class="heart-caption   mb-0">
                  Wishing you a lifetime filled with love,<br>
                  happiness,and endless togetherness.
                </p>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

</section>
