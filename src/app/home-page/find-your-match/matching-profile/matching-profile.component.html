<div class="container matching-section py-4">

  <ng-container *ngIf="!useSlider; else sliderMode">
    <div class="row g-4 row-cols-1 row-cols-md-2 row-cols-lg-3">
      <div class="col" *ngFor="let profile of profiles">
        <ng-container *ngTemplateOutlet="profileCard; context: { $implicit: profile }"></ng-container>
      </div>
    </div>
  </ng-container>

  <ng-template #sliderMode>
    <div class="slider-viewport">
      <div class="slider-track" [style.transform]="translateX">
        <div class="slider-page" *ngFor="let chunk of slideChunks">
          <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" *ngFor="let profile of chunk">
              <ng-container *ngTemplateOutlet="profileCard; context: { $implicit: profile }"></ng-container>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="slider-navigation-panel d-flex justify-content-center align-items-center mt-4 gap-4">
      
      <button 
        class="slider-nav-btn prev-btn border-0 d-flex align-items-center justify-content-center bg-white shadow-sm rounded-circle"
        [disabled]="currentIndex === 0"
        (click)="prevSlide()"
        aria-label="Previous Slide">
        <i class="bi bi-chevron-left nav-arrow-icon"></i>
      </button>

      <span class="slider-page-counter fw-bold text-muted">
        Page {{ currentIndex + 1 }} of {{ totalSlides }}
      </span>

      <button 
        class="slider-nav-btn next-btn border-0 d-flex align-items-center justify-content-center bg-white shadow-sm rounded-circle"
        [disabled]="currentIndex === totalSlides - 1"
        (click)="nextSlide()"
        aria-label="Next Slide">
        <i class="bi bi-chevron-right nav-arrow-icon"></i>
      </button>

    </div>
  </ng-template>
</div>

<ng-template #profileCard let-profile>
  <div class="profile-card h-100">

    <div class="avatar-wrapper">
      <img [src]="profile.avatar" [alt]="profile.name" class="avatar-img" />
    </div>

    <div class="card-body-content">
      <h5 class="profile-name">{{ profile.name }}</h5>
      <p class="profile-gender">{{ profile.gender }}</p>

      <div class="profile-meta">
        <span class="meta-item">
          <i class="ageIcon meta-icon"></i>
          {{ profile.age }}
        </span>
        <span class="meta-item">
          <i class="heightIcon meta-icon"></i>
          {{ profile.height }}
        </span>
        <span class="meta-item">
          <i class="profile-statusIcon meta-icon"></i>
          {{ profile.maritalStatus }}
        </span>
      </div>

      <div class="profile-details">
        <div class="profile-detail">
          <i class="locationPinIcon detail-icon"></i>
          <span>{{ profile.location }}</span>
        </div>
        <div class="profile-detail">
          <i class="occupationIcon detail-icon"></i>
          <span>{{ profile.profession }}</span>
        </div>
      </div>

      <button class="btn w-100 mt-3 view-btn">View Profile</button>
    </div>
  </div>
</ng-template>
