<div class="bgLogin min-vh-100 w-100 d-flex align-items-center justify-content-end p-2 p-md-4 py-4">

  <div class="container-fluid">
    <div class="row justify-content-end">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

        <div class="bg-white rounded-4 shadow-lg p-4 position-relative" style="max-width: 450px; margin: 0 auto;">

          <!-- Close Button -->
          <button class="btn-close position-absolute top-0 end-0 m-3"
                  (click)="goBack()"
                  style="z-index: 10;"
                  aria-label="Close"></button>

          <!-- Title -->
          <div class="text-center mb-4 mt-2">
            <h2 class="fw-normal mb-2" style="font-family: 'Playfair Display'; color: #1a1a1a; font-size: 2rem; letter-spacing: -0.5px;">
              Reset <span style="color: #bc4c2b;">Password</span>
            </h2>
            <p class="text-muted small mb-0" style="font-size: 0.9rem; opacity: 0.8;">
              Create your new password to access your account.
            </p>
          </div>

          <!-- New Password -->
          <div class="mb-3">
            <label class="form-label fw-medium mb-1" style="font-size: 0.85rem; color: #1a1a1a;">
              Password
            </label>
            <div class="input-group custom-input-group">
              <span class="input-group-text border-end-0">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input [type]="showNewPassword ? 'text' : 'password'"
                     class="form-control border-start-0 border-end-0 ps-1"
                     placeholder="Create a strong password"
                     [(ngModel)]="newPassword"
                     (input)="checkPasswordStrength()"
                     [disabled]="isLoading"
                     autocomplete="new-password" />
              <button type="button"
                      class="input-group-text border-start-0 bg-transparent"
                      (click)="toggleNewPasswordVisibility()"
                      tabindex="-1">
                <i [class]="showNewPassword ? 'bi bi-eye-slash text-muted' : 'bi bi-eye text-muted'"></i>
              </button>
            </div>

            <!-- Strength Bar -->
            <div *ngIf="newPassword" class="mt-2">
              <div class="d-flex align-items-center gap-2">
                <div class="strength-bar flex-grow-1">
                  <div class="strength-fill" [ngClass]="passwordStrengthClass"></div>
                </div>
                <small [ngClass]="'strength-label ' + passwordStrengthClass">{{ passwordStrength }}</small>
              </div>
            </div>

            <!-- Requirements -->
            <ul class="password-requirements mt-2 mb-0">
              <li [class.valid]="hasMinLength()">
                <i [class]="hasMinLength() ? 'bi bi-check-circle-fill text-success' : 'bi bi-circle text-muted'"></i>
                At least 8 characters
              </li>
              <li [class.valid]="hasUpperCase()">
                <i [class]="hasUpperCase() ? 'bi bi-check-circle-fill text-success' : 'bi bi-circle text-muted'"></i>
                One uppercase letter
              </li>
              <li [class.valid]="hasLowerCase()">
                <i [class]="hasLowerCase() ? 'bi bi-check-circle-fill text-success' : 'bi bi-circle text-muted'"></i>
                One lowercase letter
              </li>
              <li [class.valid]="hasNumber()">
                <i [class]="hasNumber() ? 'bi bi-check-circle-fill text-success' : 'bi bi-circle text-muted'"></i>
                One number
              </li>
              <li [class.valid]="hasSpecialChar()">
                <i [class]="hasSpecialChar() ? 'bi bi-check-circle-fill text-success' : 'bi bi-circle text-muted'"></i>
                One special character
              </li>
            </ul>
          </div>

          <!-- Confirm Password -->
          <div class="mb-4">
            <label class="form-label fw-medium mb-1" style="font-size: 0.85rem; color: #1a1a1a;">
              Confirm Password
            </label>
            <div class="input-group custom-input-group">
              <span class="input-group-text border-end-0">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input [type]="showConfirmPassword ? 'text' : 'password'"
                     class="form-control border-start-0 border-end-0 ps-1"
                     [class.is-valid]="confirmPassword && newPassword === confirmPassword"
                     [class.is-invalid]="confirmPassword && newPassword !== confirmPassword"
                     placeholder="Create a strong password"
                     [(ngModel)]="confirmPassword"
                     [disabled]="isLoading"
                     autocomplete="new-password"
                     (keyup.enter)="resetPassword()" />
              <button type="button"
                      class="input-group-text border-start-0 bg-transparent"
                      (click)="toggleConfirmPasswordVisibility()"
                      tabindex="-1">
                <i [class]="showConfirmPassword ? 'bi bi-eye-slash text-muted' : 'bi bi-eye text-muted'"></i>
              </button>
            </div>

            <!-- Match Indicator -->
            <div *ngIf="confirmPassword" class="mt-1">
              <small *ngIf="newPassword === confirmPassword" class="text-success">
                <i class="bi bi-check-circle-fill me-1"></i>Passwords match
              </small>
              <small *ngIf="newPassword !== confirmPassword" class="text-danger">
                <i class="bi bi-x-circle-fill me-1"></i>Passwords do not match
              </small>
            </div>
          </div>

          <!-- Submit Button -->
          <button class="btn btn-primary-brand w-100 rounded-pill fw-semibold mb-3"
                  (click)="resetPassword()"
                  [disabled]="isLoading || !newPassword || !confirmPassword"
                  style="font-size: 0.95rem; height: 48px;">
            <span *ngIf="!isLoading">Login</span>
            <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Updating...
            </span>
          </button>

        </div>
      </div>
    </div>
  </div>

</div>
