<div class="bgLogin min-vh-100 w-100 d-flex align-items-center justify-content-end p-2 p-md-4 py-4">

  <div class="container-fluid">
    <div class="row justify-content-end">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

        <div class="bg-white rounded-4 shadow-lg p-4 position-relative" style="max-width: 450px; margin: 0 auto;">

          <!-- Close Button -->
          <button class="btn-close position-absolute top-0 end-0 m-3"
                  (click)="goBack()"
                  style="z-index: 10;"
                  aria-label="Close"></button>

          <!-- Title -->
          <div class="text-center mb-4 mt-2">
            <h2 class="fw-normal mb-2" style="font-family: 'Playfair Display'; color: #1a1a1a; font-size: 2rem; letter-spacing: -0.5px;">
              Enter <span style="color: #bc4c2b;">OTP</span>
            </h2>
            <p class="text-muted small mb-0" style="font-size: 0.9rem; opacity: 0.8;">
              OTP is sent to your email.
            </p>
          </div>

          <!-- Email Address Field -->
          <div class="mb-4">
            <label class="form-label fw-medium mb-1" style="font-size: 0.85rem; color: #1a1a1a;">
              Email Address
            </label>
            <div class="input-group custom-input-group">
              <span class="input-group-text border-end-0">
                <i class="bi bi-envelope text-muted"></i>
              </span>
              <input type="email"
                     class="form-control border-start-0 ps-1"
                     placeholder="your@email.com"
                     [value]="userEmail"
                     readonly>
            </div>
          </div>

          <!-- OTP Boxes -->
        <div class="d-flex justify-content-between gap-1 mb-4">
  <input id="input1" type="text" inputmode="numeric" pattern="[0-9]"
         class="form-control text-center fw-bold otp-box"
         maxlength="1" [disabled]="isLoading"
         (input)="moveToNext($event, 'input2')"
         (keydown)="onKeyDown($event, 'input1')" />
  <input id="input2" type="text" inputmode="numeric" pattern="[0-9]"
         class="form-control text-center fw-bold otp-box"
         maxlength="1" [disabled]="isLoading"
         (input)="moveToNext($event, 'input3')"
         (keydown)="onKeyDown($event, 'input2')" />
  <input id="input3" type="text" inputmode="numeric" pattern="[0-9]"
         class="form-control text-center fw-bold otp-box"
         maxlength="1" [disabled]="isLoading"
         (input)="moveToNext($event, 'input4')"
         (keydown)="onKeyDown($event, 'input3')" />
  <input id="input4" type="text" inputmode="numeric" pattern="[0-9]"
         class="form-control text-center fw-bold otp-box"
         maxlength="1" [disabled]="isLoading"
         (input)="moveToNext($event, '')"
         (keydown)="onKeyDown($event, 'input4')" />
</div>

          <!-- Error Message -->
          <p *ngIf="errorMessage" class="text-danger small text-center mb-3">{{ errorMessage }}</p>

          <!-- Submit Button -->
          <button class="btn btn-primary-brand w-100 rounded-pill fw-semibold mb-3"
                  (click)="verifyOtp()"
                  [disabled]="isLoading"
                  style="font-size: 0.95rem; height: 48px;">
            <span *ngIf="!isLoading">Submit</span>
            <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
              <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              Verifying...
            </span>
          </button>

          <!-- Resend -->
          <p class="text-center text-muted small mb-0">
            Didn't get OTP?
            <a class="fw-semibold text-decoration-none" style="color: #bc4c2b; cursor: pointer;"
               (click)="resendOtp()">Resend</a>
          </p>

        </div>
      </div>
    </div>
  </div>

</div>
