<div
  class="bgLogin min-vh-100 w-100 d-flex align-items-center justify-content-end p-2 p-md-4 py-4"
>
  <div class="container-fluid">
    <div class="row justify-content-end">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div
          class="bg-white rounded-4 shadow-lg p-3 p-md-4 position-relative"
          style="max-width: 450px; margin: 0 auto"
        >
          <button
            class="btn-close position-absolute top-0 end-0 m-3"
            (click)="closeModal()"
            style="z-index: 10"
            aria-label="Close"
          ></button>

          <div class="text-center mb-3 mt-1">
            <h2
              class="fw-normal mb-1"
              style="
                font-family: &quot;Playfair Display&quot;, serif;
                color: #1a1a1a;
                font-size: 1.75rem;
              "
            >
              Create Your <span style="color: #6b1a52">Profile</span>
            </h2>
            <p class="text-muted small mb-0" style="font-size: 0.85rem">
              Begin your journey to find your perfect match
            </p>
          </div>

          <button
            class="btn btn-outline-secondary w-100 rounded-pill py-2 mb-2 d-flex align-items-center justify-content-center gap-2"
            (click)="signUpWithGoogle()"
            [disabled]="isGoogleLoading"
            style="
              font-family: &quot;Inter&quot;, sans-serif;
              font-size: 0.85rem;
              border-color: #e5e7eb;
              color: #4a4a4a;
            "
          >
            <span
              *ngIf="!isGoogleLoading"
              class="d-flex align-items-center gap-2"
            >
              <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google"
                width="16"
                height="16"
              />
              Sign up with Google
            </span>
            <span
              *ngIf="isGoogleLoading"
              class="d-flex align-items-center gap-2"
            >
              <span
                class="spinner-border spinner-border-sm"
                role="status"
                aria-hidden="true"
              ></span>
              Connecting...
            </span>
          </button>

          <div class="d-flex align-items-center mb-2">
            <hr class="flex-grow-1 border-top m-0" />
            <span
              class="px-3 text-muted"
              style="font-size: 0.7rem; white-space: nowrap"
            >
              Or sign up with email
            </span>
            <hr class="flex-grow-1 border-top m-0" />
          </div>

          <form>
            <div class="mb-2">
              <label
                class="form-label fw-medium mb-1"
                style="font-size: 0.8rem; color: #1a1a1a"
              >
                Full Name
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-person text-muted"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-start-0 ps-1"
                  placeholder="Enter your full name"
                  name="fullName"
                  [(ngModel)]="fullName"
                  style="background-color: #fbf9f6"
                />
              </div>
            </div>

            <div class="mb-2">
              <label
                class="form-label fw-medium mb-1"
                style="font-size: 0.8rem; color: #1a1a1a"
              >
                Email Address
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-envelope text-muted"></i>
                </span>
                <input
                  type="email"
                  class="form-control border-start-0 ps-1"
                  placeholder="Enter your official Email"
                  name="email"
                  [(ngModel)]="email"
                  style="background-color: #fbf9f6"
                />
              </div>
            </div>

            <div class="mb-2">
              <label
                class="form-label fw-medium mb-1"
                style="font-size: 0.8rem; color: #1a1a1a"
              >
                Phone Number
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-telephone text-muted"></i>
                </span>
                <input
                  type="tel"
                  class="form-control border-start-0 ps-1"
                  placeholder="+92 300 1234567"
                  name="phone"
                  [(ngModel)]="phone"
                  style="background-color: #fbf9f6"
                />
              </div>
            </div>

            <div class="mb-3">
              <label
                class="form-label fw-medium mb-1"
                style="font-size: 0.8rem; color: #1a1a1a"
              >
                Password
              </label>
              <div class="input-group custom-input-group">
                <span class="input-group-text border-end-0">
                  <i class="bi bi-lock text-muted"></i>
                </span>
                <input
                  [type]="hidePassword ? 'password' : 'text'"
                  class="form-control border-start-0 border-end-0 ps-1"
                  placeholder="Create a strong password"
                  name="password"
                  [(ngModel)]="password"
                  style="background-color: #fbf9f6"
                />
                <span
                  class="input-group-text border-start-0 cursor-pointer"
                  (click)="togglePasswordVisibility()"
                >
                  <i
                    [class]="
                      hidePassword
                        ? 'bi bi-eye-slash text-muted'
                        : 'bi bi-eye text-muted'
                    "
                  ></i>
                </span>
              </div>
            </div>

            <button
              class="btn btn-primary-brand w-100 rounded-pill py-2 fw-semibold mb-2"
              (click)="createProfile()"
              [disabled]="isLoading"
              style="font-size: 0.9rem"
            >
              <span *ngIf="!isLoading">Create Profile</span>
              <span
                *ngIf="isLoading"
                class="d-flex align-items-center justify-content-center gap-2"
              >
                <span
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
                Creating Profile...
              </span>
            </button>
          </form>

          <div class="text-center">
            <span class="text-muted" style="font-size: 0.8rem">
              Already have an account?
            </span>
            <a
              class="txt-primary text-decoration-none fw-semibold cursor-pointer ms-1"
              routerLink="/login"
              style="font-size: 0.8rem; color: #6b1a52"
            >
              Login In
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
